# Serveren for folloes.no: vedbestillinger, kontaktskjema og eiersiden. Se server/README.md.
name = "folloes"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "folloes"
# Settes når databasen er laget (npx wrangler d1 create folloes). Står den tom, virker bare lokal testing.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
DOMENE = "folloes.no"
FIRMA = "Follo Bjørkeved"
TELEFON = "48 99 39 00"
# Hvem som får bestillinger og henvendelser (kommaseparert). Hold dem like ORDER_EMAIL og ORDER_CC i config.py.
BESTILLING_TIL = "amkleven@gmail.com"
BESTILLING_KOPI = "post@min-eiendom.no"
# Avsender. Domenet må være bekreftet hos Resend (DNS-poster hos Domeneshop).
EPOST_FRA = "Follo Eiendomsservice <bestilling@folloes.no>"
# 1 = mandag, 2 = tirsdag (0 = søndag). Hold dem like DELIVERY_DAYS["weekdays"] i config.py.
LEVERINGSDAGER = "1,2"
# Nettsidene som får lov til å snakke med serveren.
TILLATTE_OPPHAV = "https://folloes.no,https://www.folloes.no,https://andersmathisen7-design.github.io,http://localhost:8000"

# Hemmelighet (settes med «npx wrangler secret put RESEND_API_KEY», aldri her): RESEND_API_KEY
